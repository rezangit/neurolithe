# NeuroLithe in Kafka mode: an example Docker Compose setup.
#
# The container runs `neurolithe daemon`, which does four things:
#   - consumes document events ({data_id, title?, text, tags?, ts?}) and files
#     them into STM + LTM,
#   - applies write/reset commands,
#   - answers recall queries over the bus,
#   - publishes a metrics snapshot.
#
# Both memory stores live in the `neurolithe-home` volume (NEUROLITHE_HOME=/data).
#
#   docker compose --profile broker up -d --build   # with the bundled broker
#   docker compose up -d --build                    # against your own broker
#   docker compose logs -f neurolithe
#
# Configuration comes from the environment (NEUROLITHE__SECTION__KEY) and from
# an optional .env next to this file. Nothing host-specific is mounted. For a
# full config file, put neurolithe.toml in the volume (/data/neurolithe.toml).
#
# Security notes:
#   - The bundled broker is PLAINTEXT with no auth and is NOT published to the
#     host. Anyone who can produce to the commands topic can write and forget
#     memories. For a real deployment use SASL/TLS (NEUROLITHE__KAFKA__CLIENT__*,
#     see README "Kafka mode") and broker ACLs.
#   - Hard reset stays disabled unless NEUROLITHE_RESET_TOKEN is set to at least
#     16 characters.
name: neurolithe

services:
  neurolithe:
    build: .
    image: neurolithe:0.3
    restart: unless-stopped
    # On SIGTERM the daemon drains in-flight Kafka messages (up to 8 s), then
    # checkpoints the stores' WAL. Docker's default 10 s grace is too tight.
    stop_grace_period: 15s
    # Optional, git-ignored. Typical contents:
    #   NEUROLITHE__KAFKA__BROKERS=broker.example:9093
    #   NEUROLITHE__KAFKA__CLIENT__SECURITY_PROTOCOL=SASL_SSL
    #   NEUROLITHE__KAFKA__CLIENT__SASL_MECHANISM=SCRAM-SHA-512
    #   NEUROLITHE__KAFKA__CLIENT__SASL_USERNAME=neurolithe
    #   NEUROLITHE__KAFKA__CLIENT__SASL_PASSWORD=...
    #   NEUROLITHE_RESET_TOKEN=<at least 16 random characters>
    #   OPENAI_API_KEY=...        # only if you configure a cloud chat/embedding provider
    env_file:
      - path: .env
        required: false
    environment:
      NEUROLITHE_HOME: /data
      # The bundled broker (profile "broker"). Override in .env for your own.
      NEUROLITHE__KAFKA__BROKERS: ${NEUROLITHE_KAFKA_BROKERS:-kafka:9092}
      NEUROLITHE__KAFKA__GROUP_ID: neurolithe
      # Topic names (these are the defaults):
      # NEUROLITHE__KAFKA__TOPICS__DOCUMENTS: document.completed
      # NEUROLITHE__KAFKA__TOPICS__COMMANDS: memory.command
      # NEUROLITHE__KAFKA__TOPICS__QUERIES: memory.query
      # NEUROLITHE__KAFKA__TOPICS__RESULTS: memory.result
      # NEUROLITHE__KAFKA__TOPICS__METRICS: memory.metrics
      # NEUROLITHE__KAFKA__TOPICS__DLQ: dlq.memory
      # NEUROLITHE__KAFKA__TOPICS__PARKING: parking.lot
      NEUROLITHE__FEEDER__ENABLED: "true"
      NEUROLITHE__BUS_QUERY__ENABLED: "true"
    volumes:
      - neurolithe-home:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
        required: false

  # --- Optional single-node broker for trying Kafka mode locally ---
  kafka:
    profiles: ["broker"]
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # Not published to the host. To produce test events from the host, add a
    # loopback-only port and an extra listener advertised as localhost.
    # ports: ["127.0.0.1:9092:9092"]

  # Creates the topics NeuroLithe uses (idempotent), then exits.
  kafka-init:
    profiles: ["broker"]
    image: apache/kafka:3.9.1
    depends_on: [kafka]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B=kafka:9092
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --list >/dev/null 2>&1; do sleep 1; done
        for t in document.completed memory.command memory.query memory.result dlq.memory parking.lot; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists --topic $$t
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists \
          --topic memory.metrics --config cleanup.policy=compact

volumes:
  neurolithe-home:

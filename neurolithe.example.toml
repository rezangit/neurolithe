# NeuroLithe configuration.
#
# `neurolithe init` writes this file to <home>/neurolithe.toml, where <home> is
# `--home`, else $NEUROLITHE_HOME, else ~/.neurolithe. Use `--config <file>` or
# $NEUROLITHE_CONFIG to point elsewhere. The current directory is never read.
#
# Every value can also be set by an environment variable using the
# `NEUROLITHE__<SECTION>__<KEY>` form, e.g. NEUROLITHE__LLM__PROVIDER=gemini.
# API keys come from the environment (or <home>/.env), never from this file:
#   OPENAI_API_KEY / GEMINI_API_KEY / ANTHROPIC_API_KEY, or NEUROLITHE_API_KEY.

# --- Workspaces ---
# Each workspace is a completely separate memory: its own STM + LTM stores in
# <home>/workspaces/<name>/. Selected by `--workspace`, else
# $NEUROLITHE_WORKSPACE, else this value. Created on first use.
# workspace = "default"

[llm]
# Embeddings power all memory search. The default runs fully offline: a local
# ONNX model (bge-small-en-v1.5, 384-dim), downloaded once into <home>/models.
# No API key needed.
embedding_provider = "local"
embedding_model = "bge-small-en-v1.5"

# Chat LLM: optional. It is used for fact extraction (push_dialogue), context
# compression and document summaries. With "none", NeuroLithe still stores and
# recalls memory; push_dialogue just reports that learning is unavailable.
provider = "none"

# --- OpenAI chat (key: OPENAI_API_KEY) ---
# provider = "openai"
# model = "gpt-4o-mini"

# --- Anthropic chat (key: ANTHROPIC_API_KEY) ---
# provider = "anthropic"
# model = "claude-sonnet-5"

# --- Google Gemini chat (key: GEMINI_API_KEY) ---
# provider = "gemini"
# model = "gemini-2.5-flash"

# --- Fully local chat via Ollama (no API key) ---
# provider = "custom"
# model = "llama3.1"
# base_url = "http://localhost:11434/v1"

# --- Remote embeddings instead of the local model ---
# Changing the embedding model later requires `neurolithe reembed`.
# embedding_provider = "openai"                  # or "gemini", "custom"
# embedding_model = "text-embedding-3-small"
# embedding_base_url = "https://api.openai.com/v1"

# [mcp]
# Whether the MCP `workspace_switch` tool may change workspace mid-session.
# allow_workspace_switch = true

# [log]
# Diagnostics go to stderr only (stdout is the MCP transport). RUST_LOG, when
# set, overrides this. Examples: "info" (default), "debug", "neurolithe=debug,warn".
# level = "info"

# --- Memory stores ---
# STM = decaying short-term working memory. LTM = permanent long-term knowledge
# tree. Both live in <home>/workspaces/<name>/; their vector size follows the
# embedder and is recorded in each store.

# LTM spine: the curated top branches documents are filed under (plus an
# implicit "inbox"). Default: "notes" and "documents". `path` is "/"-separated.
# [[ltm.spine]]
# path = "work/projects"
# description = "Active projects: plans, decisions, status."

# --- Forgetting curve (STM only) ---
[decay]
default_half_life_days = 7.0
working_half_life_minutes = 30.0

# --- Optional: Kafka daemon (only in builds with `--features kafka`) ---
# See docs/src/kafka.md. Hard reset stays disabled unless NEUROLITHE_RESET_TOKEN
# (env) is at least 16 characters.
# [kafka]
# brokers = "localhost:9092"
# group_id = "neurolithe"
#
# [kafka.topics]            # defaults shown; set any subset
# documents = "document.completed"
# commands = "memory.command"
# queries = "memory.query"
# results = "memory.result"
# metrics = "memory.metrics"
# dlq = "dlq.memory"
# parking = "parking.lot"
#
# [kafka.client]            # librdkafka properties for every Kafka client (SASL/TLS)
# "security.protocol" = "SASL_SSL"
# "sasl.mechanism" = "SCRAM-SHA-512"
# "sasl.username" = "neurolithe"
# # sasl.password: prefer NEUROLITHE__KAFKA__CLIENT__SASL_PASSWORD in the env/.env
#
# [sweep]
# interval_secs = 300
#
# [metrics]
# interval_secs = 60
#
# [feeder]
# enabled = false
#
# [bus_query]
# enabled = false
